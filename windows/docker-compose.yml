services:
  gitlab-runner-windows:
    image: 'mcr.microsoft.com/powershell:nanoserver-ltsc2022'
    isolation: process
    user: ContainerAdministrator
    container_name: gitlab-runner-windows
    restart: always
    volumes:
      - type: npipe
        source: \\.\pipe\docker_engine
        target: \\.\pipe\docker_engine
      - type: bind
        source: C:\ProgramData\docker\secrets\gitlab-runner
        target: C:\ProgramData\docker\secrets\gitlab-runner
        read_only: true
      - type: volume
        source: data
        target: C:\Users\ContainerUser
    environment:
      - GITLAB_URL=${GITLAB_URL:-gitlab.example.com} # 필수 설정
      - TOKEN_NAME=${TOKEN_NAME:-runner_token}
      - EXECUTOR=${EXECUTOR:-docker-windows}
      - CONCURRENT_FACTOR=${CONCURRENT_FACTOR:-0.25}
      - FF_USE_ADAPTIVE_REQUEST_CONCURRENCY=true
    entrypoint: [ "pwsh", "-NoProfile", "-NonInteractive", "-Command" ]
    command:
      - |
        # 실행 중 오류 발생 시 중지
        $$ErrorActionPreference = "Stop"

        # 환경 변수 설정
        $$GitLabRunnerDir = "C:\Users\ContainerUser\GitLabRunner"
        $$GitLabRunnerPath = "$$GitLabRunnerDir\gitlab-runner.exe"
        $$ConfigPath = "$$GitLabRunnerDir\config.toml"
        $$SystemIdPath = "$$GitLabRunnerDir\.runner_system_id"

        # .runner_system_id 파일이 존재하지 않는 경우에만 MachineGUID 재설정
        if (!(Test-Path -Path "$$SystemIdPath")) {
          Write-Host ".runner_system_id not found. Resetting MachineGUID..."
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name 'MachineGuid' -Value ([guid]::NewGuid().ToString())
        }

        # 폴더 생성
        if (!(Test-Path "$$GitLabRunnerDir")) {
          Write-Host "Creating directory $$GitLabRunnerDir..."
          New-Item -Path "$$GitLabRunnerDir" -ItemType Directory -Force | Out-Null
        }

        # 폴더 권한 설정
        Write-Host "Setting permissions on $$GitLabRunnerDir..."
        icacls "$$GitLabRunnerDir" /setowner "*S-1-5-32-544" /T /C /Q
        icacls "$$GitLabRunnerDir" /reset /T /C /Q
        icacls "$$GitLabRunnerDir" /grant "Everyone:(OI)(CI)F" /T /C /Q

        # GitLab Runner 다운로드
        if (!(Test-Path "$$GitLabRunnerPath")) {
          Write-Host "Downloading GitLab Runner..."
          curl.exe -L "https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-windows-amd64.exe" -o "$$GitLabRunnerPath"
          if ($$LASTEXITCODE -ne 0) { throw "Failed to download GitLab Runner." }
        } else {
          Write-Host "GitLab Runner already exists."
        }

        # 기존 GitLab Runner 등록 해제 및 설정 파일 삭제
        if (Test-Path -Path "$$ConfigPath") {
          Write-Host "Unregistering old GitLab Runner..."
          & "$$GitLabRunnerPath" unregister --all-runners --config "$$ConfigPath"
          Remove-Item -Path "$$ConfigPath" -Force
        }

        # GitLab Runner 등록
        $$token_powershell = (Get-Content "C:\ProgramData\Docker\secrets\gitlab-runner\$${env:TOKEN_NAME}_powershell.txt").Trim()
        $$token_pwsh = (Get-Content "C:\ProgramData\Docker\secrets\gitlab-runner\$${env:TOKEN_NAME}_pwsh.txt").Trim()

        Write-Host "Registering GitLab Runner (PowerShell)..."
        & "$$GitLabRunnerPath" register `
            --non-interactive `
            --config "$$ConfigPath" `
            --url "$$env:GITLAB_URL" `
            --token "$$token_powershell" `
            --executor "$$env:EXECUTOR" `
            --docker-image "mcr.microsoft.com/windows/servercore:ltsc2022" `
            --name "$$env:COMPUTERNAME-powershell" `
            --shell "powershell" `
            --docker-isolation "process" `
            --docker-user "ContainerAdministrator" `
            --request-concurrency 4

        Write-Host "Registering GitLab Runner (pwsh)..."
        & "$$GitLabRunnerPath" register `
            --non-interactive `
            --config "$$ConfigPath" `
            --url "$$env:GITLAB_URL" `
            --token "$$token_pwsh" `
            --executor "$$env:EXECUTOR" `
            --docker-image "mcr.microsoft.com/powershell:nanoserver-ltsc2022" `
            --name "$$env:COMPUTERNAME-pwsh" `
            --shell "pwsh" `
            --docker-isolation "process" `
            --docker-user "ContainerAdministrator" `
            --request-concurrency 4

        # CPU 코어 개수에 따른 concurrent 계산 (소수점 버림 및 최소 1 보장)
        $$cpus = [double]$$env:NUMBER_OF_PROCESSORS
        $$factor = [double]$$env:CONCURRENT_FACTOR
        $$concurrent = [Math]::Floor($$cpus * $$factor)
        if ($$concurrent -lt 1) { $$concurrent = 1 }

        Write-Host "Detected $$cpus CPUs. Using factor $$factor. Setting concurrent = $$concurrent"

        # config.toml 파일 수정
        $$configData = Get-Content "$$ConfigPath"
        $$configData = $$configData -replace "^concurrent = .*", "concurrent = $$concurrent"
        Set-Content -Path "$$ConfigPath" -Value $$configData

        # GitLab Runner 실행
        Write-Host "Starting GitLab Runner..."
        & "$$GitLabRunnerPath" run --config "$$ConfigPath" --working-directory="$$GitLabRunnerDir"

volumes:
  data:
