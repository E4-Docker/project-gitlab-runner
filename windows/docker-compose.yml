services:
  gitlab-runner-windows:
    image: 'mcr.microsoft.com/powershell:nanoserver-ltsc2022'
    isolation: process
    user: ContainerAdministrator
    container_name: gitlab-runner-windows
    restart: always
    volumes:
      - type: npipe
        source: '\\.\pipe\docker_engine'
        target: '\\.\pipe\docker_engine'
      - type: bind
        source: 'C:\ProgramData\docker\secrets\gitlab-runner'
        target: 'C:\ProgramData\docker\secrets\gitlab-runner'
        read_only: true
      - type: volume
        source: config
        target: 'C:\GitLab-Runner'
    environment:
      - GITLAB_URL=${GITLAB_URL:-gitlab.example.com} # 필수 설정
      - TOKEN_NAME=${TOKEN_NAME:-runner_token.txt}
      - EXECUTOR=${EXECUTOR:-docker-windows}
      - DOCKER_IMAGE=${DOCKER_IMAGE:-mcr.microsoft.com/powershell:nanoserver-ltsc2022}
      - CONCURRENT_FACTOR=${CONCURRENT_FACTOR:-0.25}
      - FF_USE_ADAPTIVE_REQUEST_CONCURRENCY=true
    entrypoint: [ "pwsh", "-NoProfile", "-NonInteractive", "-Command" ]
    command:
      - |
        # 실행 중 오류 발생 시 중지
        $$ErrorActionPreference = "Stop"

        # 환경 변수 설정
        $$GitLabRunnerDir = "C:\GitLab-Runner"
        $$GitLabRunnerPath = "$$GitLabRunnerDir\gitlab-runner.exe"
        $$ConfigPath = "$$GitLabRunnerDir\config.toml"

        # GitLab Runner 다운로드
        if (!(Test-Path "$$GitLabRunnerPath")) {
            Write-Host "Downloading GitLab Runner..."
            New-Item -Path "$$GitLabRunnerDir" -ItemType Directory -Force | Out-Null
            curl.exe -L "https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-windows-amd64.exe" -o "$$GitLabRunnerPath"
            if ($$LASTEXITCODE -ne 0) { throw "Failed to download GitLab Runner." }
        }

        # 기존 GitLab Runner 등록 해제 및 설정 파일 삭제
        Write-Host 'Unregistering old GitLab Runner if exists...'
        if (Test-Path -Path "$$ConfigPath") {
            & "$$GitLabRunnerPath" unregister --all-runners --config "$$ConfigPath"
            Remove-Item -Path "$$ConfigPath" -Force
        }

        # GitLab Runner 등록
        Write-Host 'Registering new GitLab Runner...'
        $$token = (Get-Content "C:\ProgramData\Docker\secrets\gitlab-runner\$$env:TOKEN_NAME").Trim()
        & "$$GitLabRunnerPath" register `
            --non-interactive `
            --config "$$ConfigPath" `
            --url "$$env:GITLAB_URL" `
            --token "$$token" `
            --executor "$$env:EXECUTOR" `
            --docker-image "$$env:DOCKER_IMAGE" `
            --name "$$env:COMPUTERNAME" `
            --request-concurrency 4

        # CPU 코어 개수에 따른 concurrent 계산 (소수점 버림 및 최소 1 보장)
        $$cpus = [double]$$env:NUMBER_OF_PROCESSORS
        $$factor = [double]$$env:CONCURRENT_FACTOR
        $$concurrent = [Math]::Floor($$cpus * $$factor)
        if ($$concurrent -lt 1) { $$concurrent = 1 }

        Write-Host "Detected $$cpus CPUs. Using factor $$factor. Setting concurrent = $$concurrent"

        # config.toml 파일 수정
        $$configData = Get-Content "$$ConfigPath"
        $$configData = $$configData -replace "^concurrent = .*", "concurrent = $$concurrent"
        $$configData = $$configData -replace '^\s*shell = .*', 'shell = "powershell"'
        Set-Content -Path "$$ConfigPath" -Value $$configData

        # GitLab Runner 실행
        Write-Host "Starting GitLab Runner..."
        & "$$GitLabRunnerPath" run --config "$$ConfigPath" --working-directory="$$GitLabRunnerDir"

volumes:
  config:
